# BoT-SORT configuration compatible with the installed Ultralytics version.

tracker_type: botsort

# Rehausser les seuils pour ne garder que les plaques très nettes
track_high_thresh: 0.30
track_low_thresh: 0.20
new_track_thresh: 0.30

# Réduire drastiquement la mémoire (les plaques passent vite)
track_buffer: 15
match_thresh: 0.70
fuse_score: True

# Désactiver la compensation de mouvement si la caméra est fixe
gmc_method: none

# Rendre l'association géométrique extrêmement stricte
proximity_thresh: 0.70
appearance_thresh: 0.9
with_reid: false
model: auto







