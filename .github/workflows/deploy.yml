name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Vérifier que les modèles ONNX sont présents
        run: |
          test -f frontend/public/models/plate_yolo.onnx || (echo "plate_yolo.onnx manquant : lancez tools/convert_models.py puis committez-le" && exit 1)
          test -f frontend/public/models/crnn.onnx || (echo "crnn.onnx manquant" && exit 1)
      - run: npm ci
        working-directory: frontend
      - run: npm run build:static
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
